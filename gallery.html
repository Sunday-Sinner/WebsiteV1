<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gallery for Sunday Sinner: album art, photography, posters, road imagery, and behind-the-scenes fragments." />
    <title>Sunday Sinner | Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page-transition" aria-hidden="true"></div>

    <header class="site-header">
      <nav class="container nav" aria-label="Main navigation">
        <a class="brand nav-link" href="index.html">
          <img src="assets/images/branding/sunday-sinner-logo.png" alt="Sunday Sinner" />
        </a>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="nav-menu" id="nav-menu">
          <ul>
            <li><a class="nav-link" href="index.html">HOME</a></li>
            <li><a class="nav-link" href="music.html">MUSIC</a></li>
            <li><a class="nav-link" href="god.html">GOD</a></li>
            <li><a class="nav-link" href="story.html">STORY</a></li>
            <li><a class="nav-link" href="gallery.html">GALLERY</a></li>
            <li><a class="nav-link" href="merch.html">MERCH</a></li>
            <li><a class="nav-link" href="contact.html">CONTACT</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <main>
      <section class="page-banner page-banner--gallery">
        <div class="container banner-inner reveal">
          <p class="eyebrow">GALLERY</p>
          <h1>FRAGMENTS FROM THE ROAD</h1>
          <p class="subtitle">Scenes from the places, feelings, and late-night horizons behind the music.</p>
        </div>
      </section>

      <section class="page-section">
        <div class="container reveal">
          <div class="gallery-filters" aria-label="Gallery filters">
            <button class="filter-button is-active" type="button" data-filter="all">All</button>
            <button class="filter-button" type="button" data-filter="album-art">Album Art</button>
            <button class="filter-button" type="button" data-filter="song-art">Song Art</button>
            <button class="filter-button" type="button" data-filter="photography">Photography</button>
            <button class="filter-button" type="button" data-filter="road">Road</button>
            <button class="filter-button" type="button" data-filter="behind-the-scenes">Behind the Scenes</button>
            <button class="filter-button" type="button" data-filter="posters">Posters</button>
          </div>

          <div class="gallery-grid gallery-grid--all">
            <button class="gallery-item" type="button" data-image="assets/images/gallery-1.svg" data-title="Album Art" data-caption="A late-night horizon and the shape of a story waiting to start." data-category="album-art" style="--card-image: url('assets/images/gallery-1.svg');">
              <span>Album Art</span>
            </button>
            <button class="gallery-item" type="button" data-image="assets/images/gallery-2.svg" data-title="Song Art" data-caption="Fog, rust, and a road that refuses to end." data-category="song-art" style="--card-image: url('assets/images/gallery-2.svg');">
              <span>Song Art</span>
            </button>
            <button class="gallery-item" type="button" data-image="assets/images/gallery-3.svg" data-title="Photography" data-caption="The kind of silence that sits behind a windshield after midnight." data-category="photography" style="--card-image: url('assets/images/gallery-3.svg');">
              <span>Photography</span>
            </button>
            <button class="gallery-item" type="button" data-image="assets/images/gallery-4.svg" data-title="Behind the Scenes" data-caption="Dusty rooms, worn chords, and the sound of a tired room finding hope." data-category="behind-the-scenes" style="--card-image: url('assets/images/gallery-4.svg');">
              <span>Behind the Scenes</span>
            </button>
            <button class="gallery-item" type="button" data-image="assets/images/gallery-5.svg" data-title="Posters" data-caption="Old signs, worn edges, and the glow of a town that never really sleeps." data-category="posters" style="--card-image: url('assets/images/gallery-5.svg');">
              <span>Posters</span>
            </button>
            <button class="gallery-item" type="button" data-image="assets/images/gallery-6.svg" data-title="Road" data-caption="A slow drive through the memory of every place you wanted to leave." data-category="road" style="--card-image: url('assets/images/gallery-6.svg');">
              <span>Road</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div>
          <img class="footer-logo" src="assets/images/branding/sunday-sinner-logo.png" alt="Sunday Sinner" loading="lazy" />
          <p class="footer-tagline">Where the road ends, another one begins.</p>
        </div>
        <nav class="footer-links" aria-label="Footer navigation">
          <a href="music.html">Music</a>
          <a href="story.html">Story</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
      <div class="container footer-bottom"><p>&copy; 2026 Sunday Sinner. All rights reserved.</p></div>
    </footer>

    <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
      <div class="lightbox-backdrop" data-close="true"></div>
      <div class="lightbox-dialog" role="document">
        <button type="button" class="lightbox-close" aria-label="Close gallery image">&times;</button>
        <button type="button" class="lightbox-nav lightbox-prev" aria-label="Previous image">&#8592;</button>
        <button type="button" class="lightbox-nav lightbox-next" aria-label="Next image">&#8594;</button>
        <figure class="lightbox-content">
          <img id="lightbox-image" src="" alt="" />
          <figcaption>
            <span id="lightbox-category">Gallery</span>
            <strong id="lightbox-title">Image title</strong>
            <small id="lightbox-caption"></small>
          </figcaption>
        </figure>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
