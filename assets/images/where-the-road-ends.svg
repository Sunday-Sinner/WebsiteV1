<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Where the Road Ends album cover</title>
  <desc id="desc">A moody highway at night with red taillights and a dusty horizon.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#130d12"/>
      <stop offset="35%" stop-color="#2a1b1d"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>
    <radialGradient id="sunset" cx="50%" cy="28%" r="38%">
      <stop offset="0%" stop-color="#8a4b32" stop-opacity="0.8"/>
      <stop offset="38%" stop-color="#8b1e24" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#090909" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#sky)"/>
  <rect width="1200" height="1200" fill="url(#sunset)"/>
  <g opacity="0.9">
    <circle cx="615" cy="470" r="5" fill="#f5d9c0" opacity="0.8"/>
    <circle cx="720" cy="510" r="6" fill="#f5d9c0" opacity="0.65"/>
    <circle cx="790" cy="560" r="8" fill="#f5d9c0" opacity="0.5"/>
  </g>
  <path d="M0 680 C270 640 460 610 620 640 C830 680 960 700 1200 660 L1200 1200 L0 1200 Z" fill="#0d0d0d"/>
  <path d="M0 700 L1200 700" stroke="#181818" stroke-width="8"/>
  <path d="M540 700 L620 1200" stroke="#1d1d1d" stroke-width="18"/>
  <path d="M620 700 L700 1200" stroke="#1f1f1f" stroke-width="20"/>
  <path d="M0 855 L1200 855" stroke="#1d1d1d" stroke-width="10"/>
  <g fill="#8b1e24">
    <circle cx="470" cy="770" r="24"/>
    <circle cx="625" cy="788" r="18"/>
    <circle cx="820" cy="780" r="20"/>
    <circle cx="980" cy="760" r="22"/>
  </g>
  <g fill="#d8d2c4" opacity="0.45">
    <line x1="170" y1="560" x2="190" y2="620"/>
    <line x1="250" y1="545" x2="270" y2="610"/>
    <line x1="340" y1="530" x2="360" y2="595"/>
  </g>
  <g fill="#d8d2c4" font-family="Georgia, serif" font-size="54" letter-spacing="6" text-transform="uppercase">
    <text x="600" y="120" text-anchor="middle" fill="#d8d2c4" opacity="0.85">SUNDAY</text>
    <text x="600" y="170" text-anchor="middle" fill="#d8d2c4" opacity="0.6">SINNER</text>
  </g>
  <g fill="#d8d2c4" font-family="Arial, sans-serif" font-size="62" letter-spacing="8">
    <text x="600" y="1040" text-anchor="middle">WHERE THE ROAD ENDS</text>
  </g>
</svg>
